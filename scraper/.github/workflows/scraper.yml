name: Daily Lead Scraper

on:
  schedule:
    # Run daily at 13:00 UTC
    - cron: '0 13 * * *'

  # Allow manual trigger
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > scraper/.env
          echo "PYTHONUNBUFFERED=1" >> scraper/.env

      - name: Initialize database (if needed)
        working-directory: scraper
        run: |
          docker-compose --profile init run init-db || echo "Database already initialized"

      - name: Run scraper
        working-directory: scraper
        run: docker-compose up scraper

      - name: Cleanup
        if: always()
        working-directory: scraper
        run: docker-compose down
